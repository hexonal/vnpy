name: Python application

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy uv types-tqdm
          uv pip install ta-lib==0.6.4 --index=https://pypi.vnpy.com --system
          uv pip install -e .[alpha,dev] --system

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy vnpy

      # 本仓此前的 CI 只跑 ruff/mypy/build，一个用例都不执行 —— 于是
      # tests/test_alpha101.py 里 4 个 NameError 从上游 5881a61b(2025-12-24
      # 删掉 cast_to_int 却漏改测试)起一直红着，谁也没看见。
      - name: Test
        run: |
          pip install pytest
          pytest tests -q

      - name: Build
        run: uv build
